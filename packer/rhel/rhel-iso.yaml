# From hashicorp/packer-plugin-kubevirt examples/builder/kubevirt-iso/rhel (verbatim).
# Set the ISO URL below, or upload it directly:
#   virtctl image-upload dv rhel-10-x86-64-iso --size=10Gi \
#     --image-path=./rhel-10.0-x86_64-dvd.iso --force-bind --insecure -n vm-build
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: rhel-10-x86-64-iso
  annotations:
    cdi.kubevirt.io/storage.bind.immediate.requested: "true"
spec:
  source:
    http:
      url: "<URL>"
  pvc:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi
